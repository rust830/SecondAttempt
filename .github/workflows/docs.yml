name: docs

# 只在"会影响站点内容"的文件变动时跑。Source/ 下的代码改动不触发构建。
on:
  push:
    branches: [main]
    paths:
      - "*.md"
      - "Tools/README.md"
      - "mkdocs.yml"
      - "Tools/sync_docs.py"
      - ".github/docs-requirements.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 记录本周缓存键
        run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: mkdocs-material-

      - name: 安装依赖
        run: pip install -r .github/docs-requirements.txt

      - name: 同步文档到 docs/
        run: python Tools/sync_docs.py

      - name: 构建站点
        run: mkdocs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
