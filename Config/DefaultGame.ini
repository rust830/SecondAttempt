; GameplayCue 资产是按 tag 在运行时查的,没有任何硬引用,cook 的引用图里看不到它们。
; 不显式指定的话,GC 及其引用的粒子/相机震动/蒙太奇在打包版里会全部缺失。
+DirectoriesToAlwaysCook=(Path="/Game/LOL/Blueprints/GAS/GC")

; 音效事件表 DA_HeroAudioConfig 是运行时 StaticLoadObject 按路径加载的,没有任何硬引用,
; cook 看不到它 ⇒ 打包版里配置资产整个缺失,所有事件音全哑(2026-10-05 实锤)。
; 表里的音效已改成硬引用(见 UHeroAudioConfig 类注释),跟着配置一起被这行带进包。
; 目录总共 156K,整个 cook 不心疼。
+DirectoriesToAlwaysCook=(Path="/Game/LOL/Audio")

; 上面解决"进不进包",下面解决"运行时去哪儿找"。
; 不配的话 AbilitySystemGlobals.cpp:645 会回退成扫全部 /Game(几千个资产,启动变慢 + 一条 Warning)。
; section 名必须是 AbilitySystemGlobals —— UGameplayAbilitiesDeveloperSettings 重写了配置段名以兼容旧项目。
[/Script/GameplayAbilities.AbilitySystemGlobals]
+GameplayCueNotifyPaths=/Game/LOL/Blueprints/GAS/GC

